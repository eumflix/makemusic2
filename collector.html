<style>
/* 레이아웃: 위에서 아래로 한 줄기. 설정 → 안내 → 조성 후보 → 악보 → (화면 아래에 붙는) 입력 패널 */
:root{

  --kwhite:#FFFFFF; --kblack:#222B37; --kline:#AEB8C5; --kwhite-off:#E1E6EC; --kblack-off:#A9B2BE; --klabel:#16202B;

  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#8EA2FF; --accent-ink:#0D1219; --accent-soft:#232F66;
  --gM:#8DB6FF; --gMs:#1F3158; --gm:#B79CFF; --gms:#33265E; --gx:#FFB45E; --gxs:#4A3217; --gstg:#1B1538; --goff:#51477C;
  --rec:#52D690; --rec-bg:#7FDDA9; --pos-bg:#F2CE68; --warn:#F0A06A; --warn-bg:#4A2D1B;
  --kwhite:#E9EEF4; --kblack:#0B0F15; --kline:#46525F; --kwhite-off:#35404D; --kblack-off:#232B35; --klabel:#16202B;
  --shadow:0 -8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#161D27; --surface2:#212B38; --ink:#E8EDF3; --muted:#9AA7B8; --line:#2E3A49; --staff:#5A6779;
  --accent:#8EA2FF; --accent-ink:#0D1219; --accent-soft:#232F66;
  --gM:#8DB6FF; --gMs:#1F3158; --gm:#B79CFF; --gms:#33265E; --gx:#FFB45E; --gxs:#4A3217; --gstg:#1B1538; --goff:#51477C;
  --rec:#52D690; --rec-bg:#7FDDA9; --pos-bg:#F2CE68; --warn:#F0A06A; --warn-bg:#4A2D1B;
  --kwhite:#E9EEF4; --kblack:#0B0F15; --kline:#46525F; --kwhite-off:#35404D; --kblack-off:#232B35; --klabel:#16202B;
  --shadow:0 -8px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);padding-inline:16px;padding-block:18px 0;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font:700 28px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5;text-wrap:balance}

.settings>.on-l2,.settings>.on-l3,.settings>#fNcBtn,.settings>#fLeapBtn{height:60.3px;box-sizing:border-box}      /* 레벨마다 설정 줄 높이가 0.3px씩 달라지지 않게 */
@media (min-width:561px){body[data-mode="general"] .guide{grid-template-columns:minmax(0,1fr) auto;align-items:center}body[data-mode="general"] .guide>.steps{grid-column:1;grid-row:1}body[data-mode="general"] .guide>.gen-only{grid-column:2;grid-row:1}body[data-mode="general"] .guide>.tourrow{grid-column:1/-1}}   /* 두 줄 자리를 항상 비워 둬서 레벨이 바뀌어도 버튼 위치가 그대로 */
.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;flex:1 1 100%}
/* 1줄: 레벨 + 설정 / 2줄(레벨2부터): 비화성음·도약 금지·마디 수 — 레벨이 바뀌어도 첫 줄은 그대로 */
.settings>.field{order:4}
.settings>.field:first-child,.settings>.nmfield{order:1}
.settings>details.more{order:2}
.settings>.sbreak{order:3;flex:0 0 100%;height:0;margin:-10px 0}
body[data-level="0"] .sbreak,body[data-level="1"] .sbreak{display:none}
@media (min-width:561px){.settings>.sbreak{display:none}.settings{gap:10px 14px}}   /* 넓은 화면: 레벨·설정·규칙 버튼을 한 줄에 */
.top{position:relative}
.mlogo{position:absolute;top:6px;right:0;height:19px;width:auto;pointer-events:none}

.qrbtn{white-space:nowrap}
.qrbox{text-align:center}

.tempo .btn{min-width:4.2em}
.dice{position:absolute;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:14px;background:color-mix(in srgb,var(--surface) 97%,transparent);border-radius:inherit}
.dice .dd{width:84px;height:84px}

@keyframes dtumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-22px) rotate(110deg)}50%{transform:translateY(0) rotate(200deg)}75%{transform:translateY(-12px) rotate(290deg)}100%{transform:translateY(0) rotate(360deg)}}

.dur svg{color:var(--ink)}
.dur[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

.dur small{color:var(--muted);font-size:11px}
.meter{display:grid;gap:3px;min-width:140px}

.cells i{height:10px;border-radius:2px;background:var(--surface2);border:1px solid var(--line)}

.beats{display:grid;grid-template-columns:repeat(var(--b),1fr);font-size:11px;color:var(--muted);text-align:left}
.mlabel{font-size:12px;color:var(--muted)}
.status{font-size:14px;min-height:22px;margin:0}
.status.flash{color:var(--warn);font-weight:600}
.kbwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.kb{position:relative;height:var(--wh);margin-inline:auto}
.k{position:absolute;top:0;padding:0 0 5px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;border:1px solid var(--kline);border-radius:0 0 6px 6px;line-height:1.15;touch-action:manipulation}

.k.nokey .kl,.k.nokey .kd{opacity:0}
.k.w.pos{background:var(--pos-bg);color:var(--klabel)}
.k.w.rec{background:var(--rec-bg);color:var(--klabel);border-color:var(--rec)}
.k.b.pos{background:#E4B73A;color:#16202B;border-color:#E4B73A}
.k.b.rec{background:#3FBF7F;color:#06241A;border-color:#3FBF7F}

.k.cur1{outline:2px solid var(--accent);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend.inleg{flex:1 1 0;min-width:0;display:none}
@media (min-width:561px){.legend.inleg{display:flex}#legend.dup,.visw .legend.vdup{display:none}}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--kline)}
.legend .l-rec{background:var(--rec-bg);border-color:var(--rec)}
.legend .l-pos{background:var(--pos-bg)}
.legend .l-off{background:var(--kwhite-off)}
.legend .l-prev{background:var(--accent);border-radius:50%;border-color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.exp{position:relative}

@media (max-width:560px){.wide{display:none}.titlerow{gap:8px}.titlerow h1{font-size:21px}.topbtns{gap:6px}.topbtns .btn{padding:4px 9px;font-size:13px;min-height:34px}.top>div:first-child h1{padding-right:0}.acts .btn{flex:1 1 auto}.acts{gap:6px}.settings .field>.btn{padding:6px 8px;font-size:13px}.sc-head{flex-wrap:nowrap;gap:8px}.title-in{flex:1 1 0;max-width:none;font-size:16px}.tempo-seg{gap:4px;flex:0 0 auto}.tempo-seg .lbl{font-size:11px;letter-spacing:0}.tempo-seg .seg button{padding:4px 8px}h1{font-size:24px}.top{gap:10px}.mlogo{height:15px;top:0}.top{padding-top:18px}
  #segLevel button{padding:7px 3px;min-width:0;font-size:12.5px;white-space:nowrap}.nmtog span{padding:5px 8px!important}.settings{gap:10px 8px}details.more summary{padding:7px 10px}
  .settings>#fLeapBtn{order:6}.settings>#fBars{order:7}#segBars button{padding:7px 7px;min-width:0}.durs{flex-wrap:nowrap;width:100%}.dur{flex:1 1 0;min-width:0;min-height:52px;padding:4px 1px}.dur span{display:none}.dur small{font-size:11.5px;color:var(--ink)}.meter{width:100%}.legend{font-size:11.5px;gap:2px 10px}.btn{padding:6px 12px}.dock{padding-top:8px}.dock-in{gap:6px}}
@media (prefers-reduced-motion:no-preference){.score svg .cursor{animation:blink 1.2s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}}

/* ===== 두 가지 모드 ===== */
body[data-mode="beginner"] .gen-only,body[data-mode="general"] .bg-only{display:none!important}
body[data-phase="plan"] .wr-only{display:none!important}
body[data-phase="plan"] .dock{display:none}
.band{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

.ib .dots{display:inline-flex;gap:3px}

.ib .dots i.on{background:var(--accent)}
.doneact{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.doneact[hidden]{display:none}
.xres{display:block;text-align:center;text-decoration:none;margin-top:10px}
.xin{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:12px}
.settings>.ncrow{order:9;flex:1 1 100%;flex-direction:row;align-items:center;gap:8px}
.ncrow .lbl{white-space:nowrap;font-size:13px}
.ncsel{display:flex;flex-wrap:nowrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--muted);white-space:nowrap}
.ncsel select{min-height:38px;padding:0 2px;width:62px}
.ncsel label+select{margin-right:6px}
@media (max-width:359px){.settings>.ncrow,.ncsel{flex-wrap:wrap}}
.kbrow{display:flex;align-items:stretch;gap:6px}

.rhybox{width:min(480px,100%);position:relative}.rhybox h3{margin:0 0 6px;font-size:17px}.rhybox .rgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}.rhybox .rr{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}

/* ===== 레벨 · 입력 방식 ===== */

.tour .tspot{position:fixed;border:3px solid #FFD23F;border-radius:16px;box-shadow:0 0 0 9999px rgba(18,12,48,.62),0 0 18px 4px rgba(255,210,63,.65);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s;animation:tourpulse 1.4s ease-in-out infinite}

.tour .tip{position:fixed;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 32px rgba(0,0,0,.4);transition:top .25s,left .25s}

/* 점수가 없는 옛 제출도 저장된 틀린 개수와 곡 기록으로 지금 기준에 맞춰 다시 계산한다 */
function evRescore(x) {
  if (x.score != null && x.accChord != null) return { score: x.score, c: x.accChord, n: x.accNote, r: x.accRhythm, re: false };
  const N = +x.bars || 8, W = x.level === 2 ? { c: 50, n: 40, r: 10 } : { c: 35, n: 55, r: 10 };
  const tail = String(x.text || '').split('■ 학생이 만든 곡')[1] || '';
  const nNote = tail.split('\n').filter(l => /^\d+마디 /.test(l)).reduce((a, l) => a + (l.split(' · ').slice(-1)[0] || '').replace(/(낮은|높은) /g, '').trim().split(/\s+/).filter(Boolean).length, 0);
  if (!nNote) return null;
  const c = (N - (x.nChords || 0)) / N, n = (nNote - (x.nNotes || 0)) / nNote, r = Math.max(0, (N - 1 - (x.nRhythm || 0)) / (N - 1));
  return { score: Math.round(c * W.c + n * W.n + r * W.r), c: Math.round(c * 100), n: Math.round(n * 100), r: Math.round(r * 100), re: true };
}
function evInfo(x) {          // 목록용: 점수·총평·세부 (옛 제출은 저장된 글에서 다시 만든다)
  const q = evRescore(x), reasons = evReasonsFromText(x.text), comment = x.comment || evComment(reasons);
  const t = String(x.text || ''), k = t.indexOf('■ '), detail = k >= 0 ? t.slice(k) : t;
  return { q, comment, detail };
}
function evCsv() {
  const esc = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [['제출시각', '반/코드', '이름', '레벨', '마디', '총점', '코드%', '음%', '리듬%', '틀린개수', '이탈횟수', '이탈초', '총평']];
  (EV.list || []).forEach(x => { const f = evInfo(x), q = f.q || {}; rows.push([x.at, x.klass || '', x.name, x.level, x.bars, q.score, q.c, q.n, q.r, x.total, x.awayN || 0, Math.round((x.awayMs || 0) / 1000), f.comment]); });
  return '\ufeff' + rows.map(r => r.map(esc).join(',')).join('\r\n');
}
async function evCsvSave() {

    }).join(''));
