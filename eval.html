<title>나도 작곡가 평가</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위에서 아래로 한 줄기. 설정 → 안내 → 조성 후보 → 악보 → (화면 아래에 붙는) 입력 패널 */
:root{
  --bg:#EFF2F6; --surface:#FFFFFF; --surface2:#E6EBF1; --ink:#16202B; --muted:#586577; --line:#CBD3DD; --staff:#9AA5B3;
  --accent:#2C49D6; --accent-ink:#FFFFFF; --accent-soft:#DDE4FF;
  --rec:#19905A; --rec-bg:#BDEBD0; --pos-bg:#FFE49A; --warn:#B3501B; --warn-bg:#FBE6D8;
  --kwhite:#FFFFFF; --kblack:#222B37; --kline:#AEB8C5; --kwhite-off:#E1E6EC; --kblack-off:#A9B2BE; --klabel:#16202B;
  --shadow:0 -8px 24px rgba(22,32,43,.10);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1219; --surface:#161D27; --surface2:#212B38; --ink:#E8EDF3; --muted:#9AA7B8; --line:#2E3A49; --staff:#5A6779;
  --accent:#8EA2FF; --accent-ink:#0D1219; --accent-soft:#232F66;
  --rec:#52D690; --rec-bg:#7FDDA9; --pos-bg:#F2CE68; --warn:#F0A06A; --warn-bg:#4A2D1B;
  --kwhite:#E9EEF4; --kblack:#0B0F15; --kline:#46525F; --kwhite-off:#35404D; --kblack-off:#232B35; --klabel:#16202B;
  --shadow:0 -8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#161D27; --surface2:#212B38; --ink:#E8EDF3; --muted:#9AA7B8; --line:#2E3A49; --staff:#5A6779;
  --accent:#8EA2FF; --accent-ink:#0D1219; --accent-soft:#232F66;
  --rec:#52D690; --rec-bg:#7FDDA9; --pos-bg:#F2CE68; --warn:#F0A06A; --warn-bg:#4A2D1B;
  --kwhite:#E9EEF4; --kblack:#0B0F15; --kline:#46525F; --kwhite-off:#35404D; --kblack-off:#232B35; --klabel:#16202B;
  --shadow:0 -8px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);padding-inline:16px;padding-block:18px 0;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font:700 28px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5;text-wrap:balance}
@media (min-width:561px){.sub{min-height:3em}}   /* 두 줄 자리를 항상 비워 둬서 레벨이 바뀌어도 버튼 위치가 그대로 */
.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;flex:1 1 100%}
/* 1줄: 레벨 + 설정 / 2줄(레벨2부터): 비화성음·도약 금지·마디 수 — 레벨이 바뀌어도 첫 줄은 그대로 */
.settings>.field{order:4}
.settings>.field:first-child,.settings>.nmfield{order:1}
.settings>details.more{order:2}
.settings>.sbreak{order:3;flex:0 0 100%;height:0;margin:-10px 0}
body[data-level="0"] .sbreak,body[data-level="1"] .sbreak{display:none}
@media (min-width:561px){.settings>.sbreak{display:none}.settings{gap:10px 14px}}   /* 넓은 화면: 레벨·설정·규칙 버튼을 한 줄에 */
.top{position:relative}
.mlogo{position:absolute;top:6px;right:0;height:19px;width:auto;pointer-events:none}

.qrbtn{white-space:nowrap}
.qrbox{text-align:center}
.qrbox img.qrlg{display:block;margin:0 auto 6px;height:26px;width:auto}
.qrbox h2{margin:0 0 2px;font:700 18px/1.3 var(--f-display)}
.qrbox p{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.qrbox svg{width:min(100%,300px);height:auto;background:#fff;display:block;margin:0 auto 8px;border:6px solid #fff;border-radius:6px}
.qrbox .qurl{word-break:break-all;font-size:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;min-width:40px;border-right:1px solid var(--line);font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
details.more{align-self:flex-end}
details.more summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--surface);font-size:14px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{background:var(--surface2)}
details.more[open]{flex:1 1 100%}
.more-body{margin-top:8px;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.more-body select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.chk input{margin-top:4px;accent-color:var(--accent)}
.chk small{display:block;color:var(--muted);font-size:12.5px}

.guide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.steps{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);padding:3px 11px 3px 4px;border-radius:99px;border:1px solid transparent}
.steps b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.steps li.now{color:var(--ink);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.steps li.now b{background:var(--accent);color:var(--accent-ink)}
.steps li.done b{background:var(--rec);color:#fff}
.steps li.done{color:var(--ink)}
.hint{margin:0;font-size:14.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-size:14px;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45}

.keypanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.kp-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.kp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;background:var(--bg);min-width:0}
.kcard.top{border-color:var(--accent);background:var(--accent-soft)}
.kcard.cur{border-color:var(--rec);box-shadow:inset 0 0 0 1px var(--rec)}
.kcard.dim{opacity:.55}
.kc-badge{font-size:12px;font-weight:600;color:var(--accent);min-height:18px}
.kc-name{font:700 21px/1.25 var(--f-display)}
.kc-en{font-size:13px;color:var(--muted)}
.kc-why{font-size:13.5px;margin-top:2px}
.kc-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ksum{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.ksum b{font:700 18px var(--f-display)}
.ksum span{color:var(--muted);font-size:13.5px}
.textbtn{background:none;border:0;color:var(--accent);padding:4px 0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;justify-self:start}

.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.sc-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:flex-start;margin-bottom:6px}
.title-in{flex:1 1 120px;max-width:300px;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 2px;font:700 18px var(--f-display);color:var(--ink)}
.title-in::placeholder{color:var(--muted);font-weight:400}
.sc-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tempo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tempo input{width:96px;accent-color:var(--accent)}
.tempo output{min-width:2.4em;color:var(--ink);font-variant-numeric:tabular-nums}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;background:var(--accent-soft);border-radius:9px;padding:6px 10px;margin-bottom:6px}
.score{color:var(--ink);position:relative;min-width:0}
.score svg{display:block;max-width:100%;height:auto}
.score svg .hit{fill:transparent;cursor:pointer}
.score svg .vf-stavenote.sel *,.score svg .vf-stavenote.playing *{fill:var(--accent)!important;stroke:var(--accent)!important}
.score svg .cursor{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.score svg .ghost-note{fill:var(--muted);font:13px var(--f-ui)}
.curanchor{position:absolute;left:0;width:1px;pointer-events:none;scroll-margin-bottom:calc(var(--dockh,300px) + 16px);scroll-margin-top:12px}
.summary{display:grid;gap:3px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:14px}
.summary b{font-weight:600}
.err{padding:18px;border:1px dashed var(--warn);border-radius:10px;color:var(--warn)}

.dock{position:sticky;bottom:0;z-index:10;margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow)}
.dock-in{max-width:1080px;margin:0 auto;display:grid;gap:8px;min-width:0}
.dock-top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.durs{display:flex;gap:6px;flex-wrap:wrap}
.dur{display:grid;justify-items:center;align-content:center;gap:1px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 8px 3px;min-width:62px;min-height:60px;font-size:11.5px;color:var(--ink)}
.dur svg{color:var(--ink)}
.dur[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.dur[aria-disabled="true"]{opacity:.38}
.dur small{color:var(--muted);font-size:11px}
.meter{display:grid;gap:3px;min-width:140px}
.cells{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px}
.cells i{height:10px;border-radius:2px;background:var(--surface2);border:1px solid var(--line)}
.cells i.used{background:var(--muted);border-color:var(--muted)}
.cells i.pv{background:var(--accent);border-color:var(--accent)}
.beats{display:grid;grid-template-columns:repeat(var(--b),1fr);font-size:11px;color:var(--muted);text-align:left}
.mlabel{font-size:12px;color:var(--muted)}
.status{font-size:14px;min-height:22px;margin:0}
.status.flash{color:var(--warn);font-weight:600}
.kbwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.kb{position:relative;height:var(--wh);margin-inline:auto}
.k{position:absolute;top:0;padding:0 0 5px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;border:1px solid var(--kline);border-radius:0 0 6px 6px;line-height:1.15;touch-action:manipulation}
.k.w{height:var(--wh);background:var(--kwhite);color:var(--klabel)}
.k.b{height:var(--bh);z-index:2;background:var(--kblack);color:#fff;border-color:var(--kblack)}
.k .kl{font-size:12.5px;font-weight:600}
.k .kd{font-size:10.5px;opacity:.7;min-height:12px}
.k.w.off{background:var(--kwhite-off);color:var(--muted);cursor:not-allowed}
.k.b.off{background:var(--kblack-off);border-color:var(--kblack-off);cursor:not-allowed}
.k.nokey .kl,.k.nokey .kd{opacity:0}
.k.w.pos{background:var(--pos-bg);color:var(--klabel)}
.k.w.rec{background:var(--rec-bg);color:var(--klabel);border-color:var(--rec)}
.k.b.pos{background:#E4B73A;color:#16202B;border-color:#E4B73A}
.k.b.rec{background:#3FBF7F;color:#06241A;border-color:#3FBF7F}
.k.tonic .kl{text-decoration:underline;text-underline-offset:3px}
.k.prev::after{content:"";position:absolute;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.k.cur1{outline:2px solid var(--accent);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--kline)}
.legend .l-rec{background:var(--rec-bg);border-color:var(--rec)}
.legend .l-pos{background:var(--pos-bg)}
.legend .l-off{background:var(--kwhite-off)}
.legend .l-prev{background:var(--accent);border-radius:50%;border-color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.exp{position:relative}
.expmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.2);display:grid}
.expmenu button{text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-size:14px}
.expmenu button:hover{background:var(--surface2)}
.expmenu small{display:block;color:var(--muted);font-size:12.5px}
@media (max-width:560px){.wide{display:none}.titlerow{gap:8px}.titlerow h1{font-size:21px}.topbtns{gap:6px}.topbtns .btn{padding:4px 9px;font-size:13px;min-height:34px}.top>div:first-child h1{padding-right:0}.acts .btn{flex:1 1 auto}.acts{gap:6px}.settings .field>.btn{padding:6px 8px;font-size:13px}.sc-head{flex-wrap:nowrap;gap:8px}.title-in{flex:1 1 0;max-width:none;font-size:16px}.tempo-seg{gap:4px;flex:0 0 auto}.tempo-seg .lbl{font-size:11px;letter-spacing:0}.tempo-seg .seg button{padding:4px 8px}h1{font-size:24px}.top{gap:10px}.mlogo{height:15px;top:0}.top{padding-top:18px}
  #segLevel button{padding:7px 3px;min-width:0;font-size:12.5px;white-space:nowrap}.nmtog span{padding:5px 8px!important}.settings{gap:10px 8px}details.more summary{padding:7px 10px}
  .settings>#fLeapBtn{order:6}.settings>#fBars{order:7}#segBars button{padding:7px 7px;min-width:0}.durs{flex-wrap:nowrap;width:100%}.dur{flex:1 1 0;min-width:0;min-height:52px;padding:4px 1px}.dur span{display:none}.dur small{font-size:11.5px;color:var(--ink)}.meter{width:100%}.legend{font-size:11.5px;gap:2px 10px}.btn{padding:6px 12px}.dock{padding-top:8px}.dock-in{gap:6px}}
@media (prefers-reduced-motion:no-preference){.score svg .cursor{animation:blink 1.2s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}}

/* ===== 두 가지 모드 ===== */
body[data-mode="beginner"] .gen-only,body[data-mode="general"] .bg-only{display:none!important}
body[data-phase="plan"] .wr-only{display:none!important}
body[data-phase="plan"] .dock{display:none}
.band{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ib{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;min-height:32px}
.ib.off{opacity:.5;border-style:dashed}
.ib.off .ic{filter:grayscale(1)}
.ib .dots{display:inline-flex;gap:3px}
.ib .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.ib .dots i.on{background:var(--accent)}
.doneact{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.doneact[hidden]{display:none}
.xres{display:block;text-align:center;text-decoration:none;margin-top:10px}
.xin{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:12px}
.settings>.ncrow{order:9;flex:1 1 100%;flex-direction:row;align-items:center;gap:8px}
.ncrow .lbl{white-space:nowrap;font-size:13px}
.ncsel{display:flex;flex-wrap:nowrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--muted);white-space:nowrap}
.ncsel select{min-height:38px;padding:0 2px;width:62px}
.ncsel label+select{margin-right:6px}
@media (max-width:359px){.settings>.ncrow,.ncsel{flex-wrap:wrap}}
.kbrow{display:flex;align-items:stretch;gap:6px}
.kbrow[hidden]{display:none}
.kbrow .kbwrap{flex:1 1 auto;min-width:0}
.octb{flex:0 0 46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;line-height:1;padding:0}
.octb small{font-size:11px;color:var(--muted)}
.octb[aria-disabled="true"]{opacity:.35}
.octb[hidden]{display:none}
.ib.ns{padding:3px;gap:2px;border-color:var(--accent)}
.ib.ns span{padding:5px 11px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.ib.ns span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sc-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:10px}
.playrow{display:flex;gap:8px}
.playrow .btn{flex:1 1 0;min-width:0;white-space:nowrap}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;font-size:15px}
.optrow select{min-height:40px;min-width:130px}
.chk-in{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.chk-in input{accent-color:var(--accent)}
.planpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.pp-head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.pp-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pcell{position:relative;display:grid;gap:0;justify-items:center;align-content:center;min-height:70px;padding:8px 2px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center}
.pcell:nth-child(4n+1){margin-left:0}
.pcell .pn{position:absolute;top:3px;left:6px;font-size:10.5px;color:var(--muted)}
.pcell .pr{font:700 19px/1.2 var(--f-display)}
.pcell .pc{font-size:12px;color:var(--muted)}
.pcell .pt{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--accent);font-weight:600}
.pcell.empty .pr{color:var(--muted);font-weight:400}
.pcell.fixed{background:var(--surface2)}
.pcell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.pcell.playing{background:var(--rec-bg);color:#06241A}
.pcell.playing .pc,.pcell.playing .pn{color:#06241A}

/* ---------- 틀린 이유 분류 → 총평 (규칙 기반, AI 없이) ---------- */
const EVCAT = [

  [/반종지|종지|화음 자리/, 'pos', '마디마다 정해진 화음 자리 (시작 I · 반종지 V · 종지 준비 V)'],
  [/같은 음\(계이름\)/, 'repeat', '한 마디에 같은 계이름을 두 번까지만 쓰는 규칙'],
  [/강박/, 'strong', '강박(1·3박)에는 코드 안의 음을 쓰는 규칙'],
  [/2번째·4번째 음에만|비화성음은 곡 전체|비화성음을 쓰지 않아요/, 'ncmax', '비화성음을 쓸 수 있는 자리(2·4번째 음)와 곡 전체 횟수'],
  [/이웃한 음으로|이웃한 코드 밖/, 'ncstep', '비화성음은 이웃한 음으로 이어 가는 규칙'],
  [/코드 안의 음만/, 'ct0', '마디 코드의 구성음 안에서 고르기'],
  [/너무 멀어요/, 'leap', '도약 제한(앞뒤 음과 너무 멀리 뛰지 않기)'],
  [/첫 음은 도/, 'first', '첫 음은 도로 시작하는 규칙'],
  [/마지막 음은 도|끝에서 두 번째|문장이 끝나는|반종지 마디의 끝|레\(2음\)|도\(1음\)/, 'end', '악구 끝 음 고르기 (4·7·8마디 등)'],
  [/없어요|다장조에 없는/, 'key', '다장조 음 안에서 고르기'],

function evComment(reasons) {
  if (!reasons.length) return '규칙에 어긋난 곳이 없어요. 규칙을 잘 이해하고 있어요.';
  const cnt = {}, lab = {};
  reasons.forEach(r => { const c = EVCAT.find(x => x[0].test(r)); if (c) { cnt[c[1]] = (cnt[c[1]] || 0) + 1; lab[c[1]] = c[2]; } });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 2);
  if (!top.length) return '여러 규칙에서 틀렸어요. 세부 내용을 확인해 주세요.';
  return '「' + top.map(k => lab[k] + ' ' + cnt[k] + '곳').join('」, 「') + '」 부분의 이해가 부족해 보여요.' + (top.length < Object.keys(cnt).length ? ' 그 밖에도 ' + (Object.keys(cnt).length - top.length) + '가지 규칙에서 틀렸어요.' : '');
}
const evReasonsFromText = t => (String(t || '').split('■ 학생이 만든 곡')[0].split('\n').filter(l => /^- /.test(l)).map(l => l.split(' : ').slice(1).join(' : ')));

/* ---------- 채점 ---------- */
const evNote = p => (p < 60 ? '낮은 ' : p >= 72 ? '높은 ' : '') + noteLabel(p, BG_C, 'solfege');
function evalCheck() {
  const N = S.bars, lv = S.level, res = { chords: [], notes: [], rhythm: [] };
  for (let b = 0; b < N; b++) {                 // 코드: 앞 마디와의 이어짐 · 마디 자리 규칙 (한 번만 센다)
    const plan = S.chords.slice(); for (let j = b + 1; j < N; j++) plan[j] = null;
    const o = planOptions(plan, b, N, lv)[S.chords[b]];
    if (!o.ok) res.chords.push({ bar: b + 1, chord: S.chords[b], why: o.reason });
  }
  const T = Object.assign({}, S);               // 멜로디: 앞에서부터 차례로, 그 음을 놓을 때 지켜야 했던 규칙
  for (let b = 0; b < N; b++) {

    for (let k = 0; k < S.mel[b].notes.length; k++) {
      const p = S.mel[b].notes[k]; if (p == null) continue;
      const mel = JSON.parse(JSON.stringify(S.mel));
      for (let bb = b; bb < N; bb++) for (let kk = 0; kk < mel[bb].notes.length; kk++) if (bb > b || kk >= k) mel[bb].notes[kk] = null;
      T.mel = mel; const o = melOptions(T, b, k).opts.get(p);
      if (!o) res.notes.push({ bar: b + 1, k: k + 1, note: evNote(p), why: '다장조에 없는 음이에요' });
      else if (!o.ok) res.notes.push({ bar: b + 1, k: k + 1, note: evNote(p), why: o.reason });

}
function evalReport() {

  const ncRule = '비화성음(곡 전체) 2번째 음 ' + ncCapTxt(S.ncA) + ' · 4번째 음 ' + ncCapTxt(S.ncB);
  const rule = S.level === 2 ? '비화성음 없음' : S.level === 3 ? ncRule : ncRule + ' · ' + (S.leap2 + 1) + '도 이상 도약 금지';

  const comment = evComment([...r.chords, ...r.notes, ...r.rhythm].map(x => x.why));
  const nNote = S.mel.reduce((a, m) => a + m.notes.length, 0);      // 영역별 채점 대상 수 (리듬은 6종 중 자유롭게 고르므로 채점하지 않는다)
  const acc = { c: (N - r.chords.length) / N, n: (nNote - r.notes.length) / nNote, r: 1 };
  const W = S.level === 2 ? { c: 55, n: 45, r: 0 } : { c: 40, n: 60, r: 0 };   // 영역별 비중(%)
  const score = Math.round(acc.c * W.c + acc.n * W.n + acc.r * W.r), pc = x => Math.round(x * 100) + '%';
  const L = [];
  L.push('[나도 작곡가 평가 결과]', '이름: ' + S.name + (S.klass ? ' (' + S.klass + ')' : ''), '레벨: ' + S.level + ' (' + N + '마디 · ' + rule + ')', '제출: ' + at,
    '화면 이탈: ' + ((S.away && S.away.n) ? S.away.n + '회 (총 ' + evDur(S.away.ms) + ')' : '없음'),
    '총점: ' + score + '점 / 100점', '영역별 정답률 (비중)',
    '  · 코드 진행 ' + pc(acc.c) + ' (' + (N - r.chords.length) + '/' + N + ') · 비중 ' + W.c + '%',
    '  · 음 선택 ' + pc(acc.n) + ' (' + (nNote - r.notes.length) + '/' + nNote + ') · 비중 ' + W.n + '%',
    '틀린 곳: 총 ' + r.total + '개 (코드 ' + r.chords.length + ' · 음 ' + r.notes.length + ')', '총평: ' + comment, '');
  if (r.total) {
    L.push('■ 틀린 부분');
    r.chords.forEach(x => L.push('- ' + x.bar + '마디 코드 ' + x.chord + ' : ' + x.why));
    r.notes.forEach(x => L.push('- ' + x.bar + '마디 ' + x.k + '번째 음 (' + x.note + ') : ' + x.why));

  L.push('■ 학생이 만든 곡', '코드 진행: ' + S.chords.join(' – '), ...mel);
  return { name: S.name, klass: S.klass || '', comment, level: S.level, bars: N, rule, at, atMs: d.getTime(), awayN: (S.away && S.away.n) || 0, awayMs: (S.away && S.away.ms) || 0, score, accChord: Math.round(acc.c * 100), accNote: Math.round(acc.n * 100), accRhythm: Math.round(acc.r * 100), total: r.total, nChords: r.chords.length, nNotes: r.notes.length, nRhythm: 0, noRh: true, progression: S.chords.join(' '), text: L.join('\n') };
}

function evRescore(x) {

  return { score: Math.round(c * W.c + n * W.n + r * W.r), c: Math.round(c * 100), n: Math.round(n * 100), r: Math.round(r * 100), re: true };
}

        (x.awayN ? '<p class="evq">화면 이탈 ' + x.awayN + '회 (총 ' + evDur(x.awayMs || 0) + ')</p>' : '') +
        '<details class="evdet"><summary>틀린 부분 세부 보기</summary><pre>' + h(f.detail) + '</pre></details></details>';
    }).join(''));
}

$('planPanel').addEventListener('click', e => {
  const t = e.target;

  const cell = t.closest('.pcell'); if (cell) { if (cell.getAttribute('aria-disabled') === 'true') return; S.planSel = +cell.dataset.b; renderPlan(); return; }
  if (t.id === 'ppDel') { if (t.getAttribute('aria-disabled') !== 'true') planDel(); return; }
  const chip = t.closest('.chip'); if (chip) { planPick(chip.dataset.c); return; }
  const vw = t.closest('[data-view]'); if (vw) { stopPlay(); S.planView = S.planView === vw.dataset.view ? null : vw.dataset.view; renderPlan(); return; }
  if (t.id === 'ppUnview') { stopPlay(); S.planView = null; renderPlan(); return; }
  if (t.id === 'ppReset') { if (t.getAttribute('aria-disabled') !== 'true') planSet(planInit(S.bars)); return; }
  if (t.id === 'ppStart') { planStart(); return; }
  if (t.id === 'btnPlanPlay') { play ? stopPlay() : (S.planView ? startPlay(true, planPreset(S.planView, S.bars)) : startPlay(true)); }
});
$('btnRest').onclick = onRest;
$('btnUndo').onclick = undo;
$('btnErase2').onclick = erase; $('btnClearBar').onclick = clearBar;
$('steps').addEventListener('click', e => { if (e.target.closest('[data-go="plan"]')) planBack(); });
$('steps').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-go="plan"]')) { e.preventDefault(); planBack(); } });

$('btnClear').onclick = () => (isBG() ? melHasWork(S) : S.events.length) ? ask('처음부터 다시 쓸까요? 지금까지 쓴 음이 모두 지워져요.' + (isBG() ? ' (코드 진행은 그대로예요)' : ''), clearAll) : null;
$('btnSample').onclick = loadSample;
$('confirmYes').onclick = () => { const f = confirmYes; closeAsk(); if (f) f(); };
$('confirmNo').onclick = closeAsk;
$('confirm').addEventListener('click', e => { if (e.target.id === 'confirm') closeAsk(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('confirm').hidden) closeAsk(); });
$('btnPlayBar').onclick = () => play ? stopPlay() : startPlay(false, null, S.selBar);
$('band').onclick = e => {
  const b = e.target.closest('.ib'); if (!b) return; const k = b.dataset.k;
  S.inst[k] = (S.inst[k] + 1) % 5; stopPlay(); save(); renderBand(); previewBand(S.inst[k] ? k : null);
};
$('btnPlay2').onclick = () => play ? stopPlay() : startPlay(false);
$('tempo').oninput = e => { S.tempo = +e.target.value; $('tempoOut').textContent = S.tempo; save(); };
$('title').oninput = e => { S.title = e.target.value; save(); };
function trySetting(patch, msg) {
  const apply = () => { Object.assign(S, patch); normalize(S); S.sel = null; stopPlay(); save(); renderAll(); };
  const pr = S.key && S.events.length > 1 ? firstProblem(Object.assign({}, S, patch), S.key) : null;
  pr ? ask(msg, apply) : apply();
  if (pr) renderAll();
}
$('selLeap').onchange = e => { const v = +e.target.value; trySetting({ leap: v }, '이 거리 제한에 맞지 않는 음부터 뒤쪽이 지워져요. 바꿀까요?'); $('selLeap').value = String(S.leap); };
$('chkPhrase').onchange = e => { const v = e.target.checked; trySetting({ phrase: v }, '악구 끝 규칙에 맞지 않는 음부터 뒤쪽이 지워져요. 바꿀까요?'); $('chkPhrase').checked = S.phrase; };
$('levelup').addEventListener('click', e => { if (e.target.id === 'btnLevelUp' && $('levelup')._f) $('levelup')._f(); });
$('btnName').onclick = () => { S.label = S.label === 'english' ? 'solfege' : 'english'; save(); renderAll(); };
$('btnNcGo').onclick = () => promote(3);
$('btnLeapGo').onclick = () => promote(4);
const SHARE_URL = location.href.split('#')[0].split('?')[0];   // 올려 둔 주소가 그대로 QR 코드가 돼요
function openQR() {
  if (document.querySelector('.qrmodal')) return;
  const qr = qrcode(0, 'M'); qr.addData(SHARE_URL); qr.make();
  const n = qr.getModuleCount(), mg = 4; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + mg) + ',' + (r + mg) + 'h1v1h-1z';
  const t = n + mg * 2;
  const m = document.createElement('div'); m.className = 'modal qrmodal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'QR 코드');
  m.innerHTML = '<div class="mbox qrbox"><img class="qrlg" alt="음플릭스" src="' + $('mlogo').src + '"><h2>나도 작곡가</h2><p>휴대폰 카메라로 비춰 보세요.</p>' +
    '<svg viewBox="0 0 ' + t + ' ' + t + '" shape-rendering="crispEdges" role="img" aria-label="나도 작곡가 QR 코드"><path d="' + d + '" fill="#15110f"/></svg>' +
    '<p class="qurl">' + SHARE_URL + '</p><p>제작 : 대제중학교 이현도</p><div class="mbtns"><button class="btn pri" type="button" id="qrClose">닫기</button></div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener('click', e => { if (e.target === m || e.target.id === 'qrClose') close(); });
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('qrClose').focus();
}
$('btnQr').onclick = openQR;
function openOpt(kind) {
  if (document.querySelector('.optmodal')) return;
  const capOpts = v => NC_CAPS.map(n => '<option value="' + n + '"' + (n === v ? ' selected' : '') + '>' + (n === 0 ? '쓰지 않음' : n >= 99 ? '제한 없음' : n + '번') + '</option>').join('');
  const m = document.createElement('div'); m.className = 'modal optmodal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = kind === 'nc'
    ? '<div class="mbox"><h2 style="margin-bottom:8px">비화성음 횟수</h2><p>비화성음은 마디의 2번째·4번째 음에만 쓸 수 있어요. 곡 전체에서 최대 몇 번까지 쓸지 골라요.</p>' +
      '<div class="optrow"><label for="oNcA">2번째 음</label><select id="oNcA">' + capOpts(S.ncA) + '</select></div><div class="optrow"><label for="oNcB">4번째 음</label><select id="oNcB">' + capOpts(S.ncB) + '</select></div>' +
      '<div class="mbtns"><button class="btn" type="button" data-o="no">취소</button><button class="btn pri" type="button" data-o="ok">적용</button></div></div>'
    : '<div class="mbox"><h2 style="margin-bottom:8px">도약 금지</h2><p>앞뒤 음과 몇 도 이상 멀어지는 것을 금지할지 골라요.</p>' +
      '<div class="optrow"><label for="oLeap">금지할 거리</label><select id="oLeap">' + [2, 3, 4, 5, 6].map(n => '<option value="' + n + '"' + (n === S.leap2 ? ' selected' : '') + '>' + (n + 2) + '도 이상</option>').join('') + '</select></div>' +
      '<div class="mbtns"><button class="btn" type="button" data-o="no">취소</button><button class="btn pri" type="button" data-o="ok">적용</button></div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  m.addEventListener('click', e => {
    if (e.target === m || (e.target.dataset && e.target.dataset.o === 'no')) { close(); return; }
    if (!(e.target.dataset && e.target.dataset.o === 'ok')) return;
    let patch = {}, msg;
    if (kind === 'nc') { const a = +$('oNcA').value, b = +$('oNcB').value; if (a !== S.ncA) patch.ncA = a; if (b !== S.ncB) patch.ncB = b; msg = '비화성음 횟수를 바꾸면'; }
    else { const v = +$('oLeap').value; if (v !== S.leap2) patch.leap2 = v; msg = '도약 제한을 바꾸면'; }
    close(); if (Object.keys(patch).length) changeRule(patch, msg);
  });
  m.querySelector('select').focus();
}
$('btnNcOpt').onclick = () => openOpt('nc');
$('btnLeapOpt').onclick = () => openOpt('leap');
$('chkAcc').onchange = e => { S.maxAcc = e.target.checked ? 7 : 4; save(); renderAll(); };

});

$('score').addEventListener('click', e => {
  if (isWrite()) {
    const sl = e.target.closest('.hit'), br = e.target.closest('.barhit');
    if (sl) { const b = +sl.dataset.b, k = +sl.dataset.k, p = S.mel[b].notes[k]; if (p != null) preview(p); selectBar(b, k); }
    else if (br) selectBar(+br.dataset.b);
    return;
  }
  const h = e.target.closest('.hit'); if (!h) return;
  const i = +h.dataset.i; S.sel = S.sel === i ? null : i;
  const ev = S.events[i]; if (ev && !ev.r) preview(ev.p);
  renderSel(); if (scoreMeta) { Object.values(scoreMeta.noteEls).forEach(el => el && el.classList.remove('sel')); if (S.sel != null && scoreMeta.noteEls[S.sel]) scoreMeta.noteEls[S.sel].classList.add('sel'); }
});
$('selbar').addEventListener('click', e => { if (e.target.id === 'selCut') cutAfter(); if (e.target.id === 'selOff') { S.sel = null; renderAll(); } });
$('btnExp').onclick = openExport;
document.addEventListener('click', e => { if ($('more').open && !e.target.closest('#more')) $('more').open = false; });
document.addEventListener('keydown', e => { if (e.key === 'Backspace' && !isL0() && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && $('confirm').hidden && !(isBG() && S.phase === 'plan')) { e.preventDefault(); erase(); } });
new ResizeObserver(() => document.documentElement.style.setProperty('--dockh', document.querySelector('.dock').offsetHeight + 'px')).observe(document.querySelector('.dock'));
let rz = 0; let lastW = 0;
new ResizeObserver(() => { const w = $('score').clientWidth; if (w && Math.abs(w - lastW) > 2) { lastW = w; clearTimeout(rz); rz = setTimeout(() => { renderInput(); scheduleScore(); }, 80); } }).observe($('score'));

EVAL_BOOT();
(async () => { try { if (window.claude && claude.use) { DL = await claude.use('downloads'); refreshExport(); } } catch (e) {} })();
